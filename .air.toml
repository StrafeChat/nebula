root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/nebula ./cmd/nebula"
entrypoint = "tmp/nebula"
delay = 600
stop_on_error = true
exclude_dir = ["tmp", "data", ".git"]

[watch]
include_ext = ["go"]
exclude_dir = ["tmp", "data", ".git"]

[color]
main = "cyan"
watcher = "magenta"
build = "yellow"
runner = "green"
